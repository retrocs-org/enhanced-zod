name: zod-ee release packages
on:
  workflow_dispatch:
    inputs:
      platform:
        description: Packages to build
        type: choice
        options: [all, source, macos, windows, linux]
        default: all
      notarize:
        description: Notarize macOS using configured signing credentials
        type: boolean
        default: false
      publish:
        description: Create a draft GitHub release from this reviewed version tag
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  source:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with: {fetch-depth: 0}
      - uses: actions/setup-python@v6
        with: {python-version: '3.12'}
      - run: python tests/release_tool_test.py && python tests/package_tools_test.py
      - run: python tools/release.py prepare --output outputs/release-source
      - uses: actions/upload-artifact@v7
        with: {name: release-source, path: outputs/release-source/}
  macos:
    if: inputs.platform == 'all' || inputs.platform == 'macos'
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
        with: {fetch-depth: 0}
      - name: Import optional Developer ID signing certificate
        if: inputs.notarize
        env:
          CERTIFICATE: ${{ secrets.MACOS_SIGNING_P12_BASE64 }}
          CERT_PASSWORD: ${{ secrets.MACOS_SIGNING_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.MACOS_KEYCHAIN_PASSWORD }}
        run: |
          test -n "$CERTIFICATE" && test -n "$KEYCHAIN_PASSWORD"
          keychain="$RUNNER_TEMP/zod-ee-signing.keychain-db"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$keychain"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$keychain"
          printf '%s' "$CERTIFICATE" | base64 --decode > "$RUNNER_TEMP/signing.p12"
          security import "$RUNNER_TEMP/signing.p12" -k "$keychain" -P "$CERT_PASSWORD" -T /usr/bin/codesign
          rm "$RUNNER_TEMP/signing.p12"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$keychain"
          security list-keychains -d user -s "$keychain" login.keychain-db
      - name: Build self-contained app
        env:
          CODESIGN_IDENTITY: ${{ inputs.notarize && vars.MACOS_SIGNING_IDENTITY || '-' }}
        run: ./packaging/macos/build-app.sh
      - name: Notarize and staple
        if: inputs.notarize
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
          TEAM_ID: ${{ vars.APPLE_TEAM_ID }}
        run: |
          xcrun notarytool store-credentials zod-ee --apple-id "$APPLE_ID" --team-id "$TEAM_ID" --password "$APP_PASSWORD"
          NOTARY_KEYCHAIN_PROFILE=zod-ee bash packaging/macos/notarize.sh build-app/zod-ee.app
      - name: Smoke-test packaged app
        run: python3 tools/package_smoke.py --package build-app/zod-ee.app --binary Contents/MacOS/zod-ee
      - name: Test and record provenance
        run: |
          build-importer-venv/bin/python tools/release.py check --build-dir build-app --binary build-app/zod-ee.app/Contents/MacOS/zod-ee
          arch=$(uname -m)
          build-importer-venv/bin/python tools/release.py prepare --output outputs/release-macos --artifact "macos-$arch=build-app/zod-ee.app"
      - name: Remove temporary signing keychain
        if: always() && inputs.notarize
        run: security delete-keychain "$RUNNER_TEMP/zod-ee-signing.keychain-db" || true
      - uses: actions/upload-artifact@v7
        with: {name: release-macos, path: outputs/release-macos/}
  windows:
    if: inputs.platform == 'all' || inputs.platform == 'windows'
    runs-on: windows-latest
    steps:
      - run: git config --global core.autocrlf false
      - uses: actions/checkout@v7
        with: {fetch-depth: 0}
      - uses: actions/setup-python@v6
        with: {python-version: '3.12'}
      - uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: >-
            mingw-w64-x86_64-gcc mingw-w64-x86_64-cmake
            mingw-w64-x86_64-ninja mingw-w64-x86_64-pkgconf
            mingw-w64-x86_64-sdl3 mingw-w64-x86_64-sdl3-image
            mingw-w64-x86_64-sdl3-mixer mingw-w64-x86_64-sdl3-ttf
            mingw-w64-x86_64-ffmpeg mingw-w64-x86_64-fluidsynth
      - name: Build, test and package native Windows runtime
        shell: msys2 {0}
        run: |
          set -eu
          python -m pip install -r packaging/importer/requirements.txt
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
          cmake --build build --parallel 4
          python packaging/importer/build.py --destination build/helpers
          python packaging/windows/package-native.py --build build --helpers build/helpers --destination build/runtime/zod-ee --search-dir /mingw64/bin
          python tools/package_smoke.py --package build/runtime/zod-ee --binary zod-ee.exe
          python tools/release.py check --build-dir build --binary build/zod-ee.exe
          python tools/release.py prepare --output outputs/release-windows --artifact windows-x86_64=build/runtime/zod-ee
      - uses: actions/upload-artifact@v7
        with: {name: release-windows, path: outputs/release-windows/}
  linux:
    if: inputs.platform == 'all' || inputs.platform == 'linux'
    runs-on: ubuntu-latest
    container: ubuntu:26.04
    steps:
      - name: Bootstrap checkout tools
        run: apt-get update && apt-get install -y git ca-certificates
      - uses: actions/checkout@v7
        with: {fetch-depth: 0}
      - name: Install build dependencies
        run: |
          apt-get update
          apt-get install -y build-essential cmake pkg-config curl ca-certificates python3 git binutils libsdl3-dev libsdl3-image-dev libsdl3-ttf-dev zlib1g-dev
          curl -fsSL -o /tmp/mixer.tar.gz https://github.com/libsdl-org/SDL_mixer/releases/download/release-3.2.4/SDL3_mixer-3.2.4.tar.gz
          mkdir -p /tmp/mixer
          tar -xzf /tmp/mixer.tar.gz -C /tmp/mixer --strip-components=1
          cmake -S /tmp/mixer -B /tmp/mixer/build -DCMAKE_INSTALL_PREFIX=/usr -DBUILD_SHARED_LIBS=ON -DSDLMIXER_VENDORED=OFF -DSDLMIXER_SAMPLES=OFF -DSDLMIXER_FLAC=OFF -DSDLMIXER_GME=OFF -DSDLMIXER_MOD=OFF -DSDLMIXER_MP3=OFF -DSDLMIXER_MIDI=OFF -DSDLMIXER_OPUS=OFF -DSDLMIXER_VORBIS=OFF -DSDLMIXER_WAVPACK=OFF
          cmake --build /tmp/mixer/build --parallel 4
          cmake --install /tmp/mixer/build
          ldconfig
      - uses: actions/setup-go@v6
        with: {go-version-file: web-service/go.mod, cache: false}
      - name: Build and test headless server
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
          cmake --build build --parallel 4
          CGO_ENABLED=0 go -C web-service build -o ../build/zod-agent ./cmd/zod-agent
          python3 tools/release.py check --build-dir build --binary build/zod-ee
          python3 packaging/linux/package.py --engine build/zod-ee --agent build/zod-agent --out build/server.tar.gz
          python3 tools/release.py prepare --output outputs/release-linux --artifact linux-server-x86_64=build/server.tar.gz
      - uses: actions/upload-artifact@v7
        with: {name: release-linux, path: outputs/release-linux/}
  assemble:
    needs: [source, macos, windows, linux]
    if: always() && needs.source.result == 'success' && !contains(needs.*.result, 'failure') && !contains(needs.*.result, 'cancelled')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with: {fetch-depth: 0}
      - uses: actions/download-artifact@v8
        with: {pattern: release-*, path: outputs/incoming}
      - name: Verify and assemble all platform records
        run: |
          args=()
          for dir in outputs/incoming/release-*; do args+=(--input "$dir"); done
          python3 tools/release.py collect --output outputs/release-combined "${args[@]}"
      - uses: actions/upload-artifact@v7
        with: {name: zod-ee-release, path: outputs/release-combined/}
  publish:
    needs: assemble
    if: inputs.publish
    runs-on: ubuntu-latest
    permissions: {contents: write}
    environment: release
    steps:
      - uses: actions/checkout@v7
        with: {fetch-depth: 0}
      - uses: actions/download-artifact@v8
        with: {name: zod-ee-release, path: outputs/release-combined}
      - name: Publish reviewed draft
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p work
          python3 -c 'import json,os;open("work/release-config.json","w").write(json.dumps({"github_repo":os.environ["GITHUB_REPOSITORY"]}))'
          python3 tools/release.py publish --output outputs/release-combined --config work/release-config.json --confirm-publish
